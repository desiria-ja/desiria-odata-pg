name: Watch
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record traffic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p metrics
          F=metrics/traffic.csv
          if [ ! -f "$F" ]; then
            echo "date,repo,stars,views,unique_views,clones,unique_clones" > "$F"
          fi
          D=$(date -u +%Y-%m-%d)
          S=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.stargazers_count')
          V=$(gh api "repos/$GITHUB_REPOSITORY/traffic/views" --jq '[.count,.uniques]|@csv')
          CL=$(gh api "repos/$GITHUB_REPOSITORY/traffic/clones" --jq '[.count,.uniques]|@csv')
          echo "$D,$GITHUB_REPOSITORY,$S,$V,$CL" >> "$F"
          tail -3 "$F"
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain metrics/)" ]; then
            git config user.name "Desiria LLC"
            git config user.email "314548632+desiria-dev@users.noreply.github.com"
            git add metrics/
            git commit -m "Record traffic for $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change"
          fi
      - name: Open an issue only when a human may have arrived
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          U=$(gh api "repos/$GITHUB_REPOSITORY/traffic/views" --jq '.uniques')
          S=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.stargazers_count')
          if [ "${U:-0}" -gt 0 ] || [ "${S:-0}" -gt 0 ]; then
            N=$(gh issue list --label signal --state open --json number --jq 'length')
            if [ "$N" = "0" ]; then
              gh issue create --label signal \
                --title "Traffic signal: unique views=$U stars=$S" \
                --body "Opened automatically. Unique page views or a star appeared, which is a different signal from the bot clones that arrived on publication day (29 unique clones with zero views on 2026-08-08). Worth a look."
            fi
          fi
