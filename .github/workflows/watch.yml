name: Watch
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record what the Actions token can actually read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p metrics
          F=metrics/daily.csv
          if [ ! -f "$F" ]; then
            echo "date,repo,stars,forks,watchers,open_issues" > "$F"
          fi
          D=$(date -u +%Y-%m-%d)
          ROW=$(gh api "repos/$GITHUB_REPOSITORY" --jq '[.stargazers_count,.forks_count,.subscribers_count,.open_issues_count]|@csv')
          grep -q "^$D,$GITHUB_REPOSITORY," "$F" || echo "$D,$GITHUB_REPOSITORY,$ROW" >> "$F"
          tail -3 "$F"
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain metrics/)" ]; then
            git config user.name "Desiria LLC"
            git config user.email "314548632+desiria-dev@users.noreply.github.com"
            git add metrics/
            git commit -m "Record daily counts for $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change"
          fi
      - name: Open an issue the first time a star or fork appears
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          S=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.stargazers_count')
          F=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.forks_count')
          if [ "${S:-0}" -gt 0 ] || [ "${F:-0}" -gt 0 ]; then
            N=$(gh issue list --label signal --state open --json number --jq 'length')
            if [ "$N" = "0" ]; then
              gh issue create --label signal \
                --title "Someone starred or forked this: stars=$S forks=$F" \
                --body "Opened automatically by the daily watch job. A star or fork is a deliberate human action, unlike the 29 unique clones that arrived on publication day with zero page views. Worth looking at."
            fi
          fi
